<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="widget-card">
    <div class="widget-header" id="widget-header">
      <div class="pending-pill">
        <span id="pending-count" class="pending-badge">--</span>
        <span id="pending-label" class="pending-text">fields pending</span>
      </div>
      <button id="toggle-btn" class="toggle-btn" title="Expand / collapse">&#9650;</button>
    </div>
    <div id="field-list" class="field-list"></div>
    <div id="empty-state" class="empty-state hidden">
      <p class="empty-title">All set</p>
      <p class="empty-subtitle">No pending fields.</p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
